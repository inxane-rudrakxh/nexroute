name: Build desktop installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            artifact_arch: x86_64
            target: AppImage
          - runner: windows-2025
            platform: win
            arch: x64
            artifact_arch: x64
            target: nsis
          - runner: macos-15-intel
            platform: mac
            arch: x64
            artifact_arch: x64
            target: dmg
          - runner: macos-15
            platform: mac
            arch: arm64
            artifact_arch: arm64
            target: dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install AppImage build support
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64
      - name: Install dependencies
        run: npm ci
      - name: Build the desktop renderer
        run: npm run build
      - name: Package Linux AppImage
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
      - name: Package Windows installer
        if: matrix.platform == 'win'
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - name: Package macOS disk image
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/NexRoute-${{ matrix.platform }}-${{ matrix.artifact_arch }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - name: Check out source and tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
